# ---- universal defaults ----
defaults:
  filedir: "H:/My Drive/Research/VespaPolPy"
  # filedir: "/Users/evanzhang/zzq@umd.edu - Google Drive/My Drive/Research/VespaPolPy"

  isSyn: false
  is3c: true # for synthetic this will be overriden
  comp: "Z" # only applies to real data

  num_chains: 8
  totalSteps: 100000
  burnInSteps: 80000
  nSaveModels: 200
  actionsPerStep: 1

  maxN: 10

  ampRange: [-1., 1.] # only applies to real data
  minSpace: 1.0

  CDopt: 0        # 0 - False (single Sigma value), 1 - Empirical, 2 - Robust, 3 - Fit

  isbp: false
  freqs: [0.02, 1.0]
  isds: false

  bazRange: [-50.0, 0.0]

  locDiff: false
  distDiffRange: [-5.0, -5.0]
  bazDiffRange: [-5.0, -5.0]

  phaseBaz: false
  fitAtts: false
  fitPhase: true
  isMars: false

# ---- experiment specifics ----
experiments:

  # Syn model6
  - modname: "model6"
    runname: "run1_3c_CD_0_multichain_L2"
    isSyn: true
    isMars: false
    is3c: true
    slwRange: [0., 2.]
    normOpt: 2

