# ---- universal defaults ----
defaults:
  # filedir: "H:/My Drive/Research/VespaPolPy"
  filedir: "/Users/evanzhang/zzq@umd.edu - Google Drive/My Drive/Research/VespaPolPy"

  isSyn: false
  is3c: true # for synthetic this will be overriden
  comp: "Z" # only applies to real data

  num_chains: 16
  totalSteps: 1000 #100000
  burnInSteps: 600 #60000
  nSaveModels: 200 #200
  actionsPerStep: 1

  maxN: 10

  ampRange: [-1., 1.] # only applies to real data
  minSpace: 3.0

  CDopt: 3        # 0 - False (single Sigma value), 1 - Empirical, 2 - Robust, 3 - Fit

  isbp: false
  freqs: [0.02, 1.0]
  isds: false

  bazRange: [-50.0, 0.0]

  locDiff: false
  distDiffRange: [-5.0, -5.0]
  bazDiffRange: [-5.0, -5.0]

  phaseBaz: false
  fitAtts: false
  fitPhase: true
  isMars: false

# ---- experiment specifics ----
experiments:

  # CF 1c
  - modname: "Mars_CF"
    runname: "run1_Z_CD_fit_multichain_L1_maxN10_action1"
    isMars: true
    is3c: false
    comp: "Z"
    slwRange: [-8., 8.]
    normOpt: 1
  
  - modname: "Mars_CF"
    runname: "run2_3c_CD_fit_multichain_L1_maxN10_action1"
    isMars: true
    is3c: true
    slwRange: [-8., 8.]
    normOpt: 1
  
  - modname: "Mars_CF"
    runname: "run3_Z_CD_fit_multichain_L2_maxN10_action1"
    isMars: true
    is3c: false
    comp: "Z"
    slwRange: [-8., 8.]
    normOpt: 2
  
  - modname: "Mars_CF"
    runname: "run4_3c_CD_fit_multichain_L2_maxN10_action1"
    isMars: true
    is3c: true
    slwRange: [-8., 8.]
    normOpt: 2

