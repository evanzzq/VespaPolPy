# ---- universal defaults ----
defaults:
  filedir: "H:/My Drive/Research/VespaPolPy"
  # filedir: "/Users/evanzhang/zzq@umd.edu - Google Drive/My Drive/Research/VespaPolPy"

  isSyn: false
  is3c: true # for synthetic this will be overriden
  comp: "Z" # only applies to real data

  num_chains: 8
  totalSteps: 200000
  burnInSteps: 160000
  nSaveModels: 200
  actionsPerStep: 1

  maxN: 10

  ampRange: [-1., 1.] # only applies to real data
  minSpace: 1.0

  CDopt: 3        # 0 - False (single Sigma value), 1 - Empirical, 2 - Robust, 3 - Fit

  locDiff: false
  distDiffRange: [-5.0, -5.0]
  bazDiffRange: [-5.0, -5.0]

  fitAtts: false
  fitPhase: true
  isMars: false
  srcArray: false

  pref: 0.0
  tref: 0.0

  ref_manual: false
  refLat: 9.48
  refLon: 163.03
  refBaz: 78.1

# ---- experiment specifics ----
experiments:

- modname: "model11_shifted"
  runname: "run1_L2"
  is3c: false
  isSyn: true
  slwRange: [0., 6.]
  CDopt: 0
  normOpt: 2
  totalSteps: 50000
  burnInSteps: 40000
  nSaveModels: 100

