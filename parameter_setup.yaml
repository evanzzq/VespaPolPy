workspace: configs/workspace.yaml

defaults:
  stfshape: "dGaussian"
  is3c: false
  comp: "T"
  sigma: 0.02
  num_chains: 8
  totalSteps: 200000
  burnInSteps: 150000
  nSaveModels: 200
  actionsPerStep: 1
  maxN: 10
  man_stf: false
  ampRange: [-1., 1.] # only applies to real data
  minSpace: 1.0
  CDopt: 3 # 0 - use sigma only, 3 - use fitted covariance
  locDiff: false
  distDiffRange: [-5.0, -5.0]
  bazDiffRange: [-5.0, -5.0]
  fitAtts: true
  fitLoge: true
  fitPhase: true
  normOpt: 1
  isMars: false
  srcArray: false
  pref: 0.0
  ref_manual: false
  refLat: 0.0
  refLon: 0.0
  refBaz: 0.0

experiments:
  - dataset: "Steve_deconv"
    runname: run1_L1_maxN10_G_loge
    slwRange: [-2., 2.]
    ampRange: [-1., 1.]
    maxN: 10
    man_stf: false
    stfshape: "Gaussian"
    CDopt: 0
    normOpt: 1
    fitAtts: true
    fitLoge: true
    num_chains: 8

  - dataset: "Steve_deconv"
    runname: run1_L2_maxN10_G_loge
    slwRange: [-2., 2.]
    ampRange: [-1., 1.]
    maxN: 10
    man_stf: false
    stfshape: "Gaussian"
    CDopt: 0
    normOpt: 2
    fitAtts: true
    fitLoge: true
    num_chains: 8

  - dataset: "Steve_deconv"
    runname: run1_L1_maxN10_loge
    slwRange: [-2., 2.]
    ampRange: [-1., 1.]
    maxN: 10
    man_stf: true
    CDopt: 0
    normOpt: 1
    fitAtts: true
    fitLoge: true
    num_chains: 8

  - dataset: "Steve_deconv"
    runname: run1_L2_maxN10_loge
    slwRange: [-2., 2.]
    ampRange: [-1., 1.]
    maxN: 10
    man_stf: true
    CDopt: 0
    normOpt: 2
    fitAtts: true
    fitLoge: true
    num_chains: 8
