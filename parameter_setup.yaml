# ---- universal defaults ----
defaults:
  filedir: "H:/My Drive/Research/VespaPolPy"
  # filedir: "/Users/evanzhang/zzq@umd.edu - Google Drive/My Drive/Research/VespaPolPy"

  isSyn: true
  is3c: true # for synthetic this will be overriden
  comp: "Z" # only applies to real data

  num_chains: 16
  totalSteps: 100000
  burnInSteps: 80000
  nSaveModels: 200
  actionsPerStep: 1

  maxN: 10

  ampRange: [-1., 1.] # only applies to real data
  minSpace: 1.0

  CDopt: 3        # 0 - False (single Sigma value), 1 - Empirical, 2 - Robust, 3 - Fit

  isbp: false
  freqs: [0.02, 1.0]
  isds: false

  bazRange: [-50.0, 0.0]

  locDiff: false
  distDiffRange: [-5.0, -5.0]
  bazDiffRange: [-5.0, -5.0]

  phaseBaz: false
  fitAtts: false
  fitPhase: true
  isMars: false

# ---- experiment specifics ----
experiments:

  # model 10 noise free
  - modname: "model10"
    runname: "run1_L1"
    slwRange: [0., 8.]
    CDopt: 0
    normOpt: 1
  
  - modname: "model10"
    runname: "run1_L2"
    slwRange: [0., 8.]
    CDopt: 0
    normOpt: 2
  
  # model 10 noisy L1
  - modname: "model10_noisy_L1"
    runname: "run1_L1"
    slwRange: [0., 8.]
    CDopt: 3
    normOpt: 1
  
  - modname: "model10_noisy_L1"
    runname: "run1_L2"
    slwRange: [0., 8.]
    CDopt: 3
    normOpt: 2
  
  # model 10 noisy L2
  - modname: "model10_noisy_L2"
    runname: "run1_L1"
    slwRange: [0., 8.]
    CDopt: 3
    normOpt: 1
  
  - modname: "model10_noisy_L2"
    runname: "run1_L2"
    slwRange: [0., 8.]
    CDopt: 3
    normOpt: 2

